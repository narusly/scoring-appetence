[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appetence"
version = "1.0.0"
description = "Score d'appétence bancaire : grille de score WoE/IV contre XGBoost, validation hors temps et suivi de dérive (PSI)"
authors = [{ name = "Maxime Fruntes" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "tabulate>=0.9",
                "scikit-learn>=1.4", "xgboost>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
